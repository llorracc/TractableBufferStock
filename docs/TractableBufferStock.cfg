\ConfigureEnv{subfigure}
{\ifvmode\IgnorePar\fi\EndP\HCode{<center><div class="subfigure">}
}
{\ifvmode\IgnorePar\fi\EndP\HCode{</div></center>}}{}{}
% \Css{.subfigure{display: inline-block;}} would make the figures float next to each other
\Css{.subfigure img{display:block; margin-left:auto; margin-right:auto}} % Should, but does not seem to, center captions

% The following is for figures in png format
\Configure{graphics*} 
{png} 
{%the special command below so it will copy the png over 
  \special{t4ht+@File: \csname Gin@base\endcsname.png} 
  \Picture[pict]{\csname Gin@base\endcsname .png 
    \space width="\expandafter\the\csname Gin@req@width\endcsname" 
  } 
} 

\Configure{Picture}{.svg} 

\makeatletter
\Configure{graphics*}
{svg}
{
  {\Configure{Needs}{File: \Gin@base.svg}\Needs{}}
  \Picture[\csname a:GraphicsAlt\endcsname]{\csname Gin@base\endcsname.svg
    \csname a:Gin-dim\endcsname}
}

\makeatother

% add any custom \Css or HTML commands here as needed.
% A figure's note (\FigNote): smaller type, as close under the figure as it can be. The figure's own white margin
% below its lowest mark is about 1.7 to 2.5 percent of its width; a margin given in percent is a share of the width,
% so the note is raised by 1.5 percent of it, and its sides line up with the image's (96.76 percent of the width).
\Css{div.figure p.fignote{font-size:83\%;text-align:left;text-indent:0;margin:-1.5\% 1.62\% 0 1.62\%;}}

% Regular text is justified, flush at both margins, as in the PDF (Chris Carroll, 2026-11-15: "each line of
% regular text should be justified so that both the left and the right margins are flush"). It is set on the
% body, so whatever sets its own alignment (centered titles, captions, equations, code) keeps it. Hyphenation,
% as in the PDF, keeps justified lines from opening wide gaps on narrow screens; the page declares lang="en".
\Css{body{text-align:justify; -webkit-hyphens:auto; hyphens:auto;}}

% Fix tex4ht includegraphics to allow scaling relative to textwidth
% https://tex.stackexchange.com/questions/563276/graphics-scaling-in-tex4ht
\makeatletter
\ExplSyntaxOn
\Configure{Gin-dim}{style="width:\fp_eval:n{round(\Gin@req@width/\textwidth*100,2)}\%"}
\ExplSyntaxOff
\makeatother

\Css{.equation td{text-align:center; }}
% With xhtml, tex4ht closes the paragraph before a display's table, so the text after an unnumbered display no longer
% gets a paragraph's top margin; only numbered displays (table.equation) have margins. Give the text after it one.
\Css{table.equation-star + p{margin-top:1em;}}
\Css{td.equation { margin-top:5em; margin-bottom:5em; }}

% These tell tex4ht to make inline math images also 

% Each page links to the other's labels (xr-hyper). tex4ht imports them at \begin{document}, through \XR:, and
% expands each label as it stores it (\xdef). The handout's figure captions, which its figures' labels carry, hold
% links (\href), and expanding a link breaks the build. So import the labels the way LaTeX writes such text to a
% file, with \protect keeping robust commands unexpanded. xr's messages are robust commands too, which that \protect
% would skip, leaving their text typeset before the page's <!DOCTYPE html> ("(xr) Package xr Info: IMPORTING LABELS
% FROM ..."): give them their inner definitions, which write to the log.
\makeatletter
\ifcsname XR:\endcsname
  \expandafter\let\csname tbs@XR\expandafter\endcsname\csname XR:\endcsname
  \expandafter\def\csname XR:\endcsname[#1][#2]#3{%
    \begingroup\let\protect\@unexpandable@protect
      \expandafter\let\expandafter\GenericInfo\csname GenericInfo \endcsname
      \expandafter\let\expandafter\GenericWarning\csname GenericWarning \endcsname
      \csname tbs@XR\endcsname[#1][#2]{#3}\endgroup}
\fi
\makeatother

\begin{document}

% Each page's <title> is its document's title, which the document writes to \jobname.title for \handoutNameMake.
% tex4ht writes the page's head before the document writes that file, so this reads the copy the previous LaTeX run
% left (make4ht runs LaTeX three times). The title is typeset: tex4ht turns \HCode off inside <title>.
\makeatletter
\newread\tbs@titlefile
\openin\tbs@titlefile=\jobname.title
\ifeof\tbs@titlefile\else
  \begingroup\endlinechar=-1 \global\read\tbs@titlefile to\tbs@title\endgroup
  \Configure{TITLE+}{\tbs@title}
  \Configure{HPageTITLE+}{\tbs@title\@gobble}% the footnote pages too, which html4.4ht leaves untitled
\fi
\closein\tbs@titlefile
\makeatother

% \hyperref[label]{text} prints its text by changing \Configure{ref} and \hyperrefLabel (tex4ht's hyperref.4ht), and
% nothing restores them: after a \hyperref to the other document's labels, later \refs printed that text instead of
% their numbers ("Figure approximation appendix"), and after one to this document's labels, their numbers without a
% link. Keep both changes inside the \hyperref.
\makeatletter
\let\tbs@labelhyperref\label@@hyperref
\def\label@@hyperref#1#2#3{\begingroup\tbs@labelhyperref{#1}{#2}{#3}\endgroup}
\makeatother

\Configure{$}{\PicMath}{\EndPicMath}{} 
\Configure{PicMath}{}{}{}{class="math"} % the stylesheet centers math images (img.math{vertical-align:middle})

% https://12000.org/my_notes/faq/LATEX/htch4.htm
% https://tex.stackexchange.com/questions/44541/tex4ht-limit-toc
  \ConfigureToc{section} 
      {\tocNesting{1}\HCode{<li style="list-style-type:none;color:red;font-size:x-small"><a style="font-size:x-small">}}{ }{}{ } 
   \ConfigureToc{subsection} 
      {\tocNesting{2}\HCode{<li style="list-style-type:none;color:red;font-size:x-small"><a style="font-size:x-small">}}{ }{}{ } 
   \ConfigureToc{subsubsection} 
      {\tocNesting{3}\HCode{<li style="list-style-type:none;color:red;font-size:x-small"><a style="font-size:x-small">}}{ }{}{ } 
   \Configure{tableofcontents} 
      {} {\tocNesting{0}} {} {} {} 
 
   \newcount\c 
   \def\tocNesting#1{% 
      \expandafter\ifx \csname level#1\endcsname\relax 
          \ifnum #1>0 \HCode{<ul>}\fi 
          \expandafter\def \csname level#1\endcsname{\HCode{</ul>}} 
      \fi 
      \c=#1 \advance\c by 1 
      \loop 
        \csname level\the\c\endcsname 
        \expandafter\let \csname level\the\c\endcsname\relax 
        \advance\c by 1 
      \ifnum \c<10   \repeat 
   }

   % allow textwidth in includegraphics
\makeatletter
\ExplSyntaxOn
\Configure{Gin-dim}{style="width:\fp_eval:n{round(\Gin@req@width/\textwidth*100,2)}\char_generate:nn { `\% } { 12 }"}
\ExplSyntaxOff
\makeatother
   
\EndPreamble

